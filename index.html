<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EPUB 阅读器</title>
    <meta name="theme-color" content="#2f6fdb" />
    <meta name="description" content="读 EPUB，选词用 AI 查释义，一键做成 Anki 卡片" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <header id="topbar">
      <button id="back-button" class="icon-btn" title="返回书库" hidden>‹</button>
      <button id="toc-button" class="icon-btn" title="目录" disabled hidden>☰</button>
      <div id="book-title">书库</div>
      <button id="reading-button" class="icon-btn" title="阅读设置：主题、字体、排版" hidden>Aa</button>
      <button id="settings-button" class="icon-btn" title="设置">⚙</button>
      <button id="cards-button" class="text-btn" title="卡片列表">卡片 <span id="cards-count" class="badge" hidden>0</span></button>
      <button id="open-button" class="text-btn">添加<span class="wide-only">书籍</span></button>
      <input id="file-input" type="file" multiple hidden />
    </header>

    <main id="main">
      <section id="library" hidden>
        <p id="key-banner" hidden>首次使用请先点右上角 ⚙ 填写 AI 服务的 API key</p>
        <div id="library-status" hidden></div>
        <ul id="library-grid"></ul>
        <div id="library-empty" hidden>
          <p class="empty-title">书库是空的</p>
          <p class="hint">点「添加书籍」从设备里选择 EPUB 文件。书会保存在这台设备上，以后直接点开就能接着读。</p>
          <button id="library-add" class="primary-btn">添加书籍</button>
          <p class="hint">阅读时：长按选词查释义，点屏幕左右两侧或左右滑动翻页</p>
        </div>
      </section>
      <button id="prev-button" class="nav-btn" title="上一页" hidden>‹</button>
      <div id="viewer"></div>
      <button id="next-button" class="nav-btn" title="下一页" hidden>›</button>
    </main>

    <footer id="bottombar" hidden>
      <input id="progress" type="range" min="0" max="1" step="any" value="0" list="tick-marks" />
      <datalist id="tick-marks"></datalist>
      <span id="location"></span>
    </footer>

    <div id="dim" hidden></div>
    <aside id="sidebar" aria-hidden="true">
      <div id="sidebar-head">
        <img id="cover" alt="" hidden />
        <div>
          <div id="sidebar-title"></div>
          <div id="sidebar-author"></div>
        </div>
      </div>
      <nav id="toc"></nav>
    </aside>

    <div id="cards-dim" class="dim" hidden></div>
    <aside id="cards-drawer" aria-hidden="true">
      <div id="cards-head">
        <div id="cards-title">卡片</div>
        <button id="cards-export" class="primary-btn" title="导出为 Anki 可导入的文本文件">导出到 Anki</button>
        <button id="cards-close" class="icon-btn" title="关闭">×</button>
      </div>
      <p id="cards-deck" hidden></p>
      <p id="cards-warning" hidden>浏览器存储不可用：卡片只保存到关闭页面为止。</p>
      <ul id="cards-list"></ul>
      <div id="cards-toast" hidden></div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
